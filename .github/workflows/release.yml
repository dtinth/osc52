name: Release

# Every push to main that carries a feat/fix/perf or a breaking change cuts a
# release: the version comes from the commit messages, and the release job
# creates the tag. Running this workflow by hand builds without publishing,
# unless you give it a version to release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.3. Leave empty to build without publishing.
        default: ""

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ inputs.version || steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is derived from the tags and the commits
      - id: next
        run: echo "tag=$(.github/next-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make check
      - run: tar czf osc52-$TAG-${{ matrix.target }}.tar.gz osc52
        env:
          TAG: ${{ needs.version.outputs.tag }}
          COPYFILE_DISABLE: 1 # keep macOS tar from adding ._ files
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: osc52-*.tar.gz

  publish:
    needs: [version, build]
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.tar.gz
          generate_release_notes: true
